/* Core Squiffy Runtime Styles */

/* Link styles */
a.squiffy-link
{
    text-decoration: underline;
    text-decoration-color: Blue;
    color: Blue;
    cursor: pointer;
    transition: color 0.4s ease-in-out, text-decoration-color 0.4s ease-in-out;
}

/* Rotate/sequence links - visually distinct as they update in-place rather than advancing the story */
a.squiffy-link[data-handler="rotate"],
a.squiffy-link[data-handler="sequence"] {
    text-decoration-style: dotted;
}

/* Disabled link states */
a.squiffy-link.disabled,
div.squiffy-output-section:not(:last-child) a.squiffy-link,
div.squiffy-output-section.links-disabled a.squiffy-link
{
    text-decoration: inherit;
    text-decoration-color: transparent;
    color: inherit !important;
    cursor: inherit;
    pointer-events: none;
}

/* Links disabled due to input validation */
a.squiffy-link.validation-disabled
{
    text-decoration: inherit;
    text-decoration-color: transparent;
    color: #999 !important;
    cursor: not-allowed;
    pointer-events: none;
    opacity: 0.6;
}

/* Invalid input field states */
input.squiffy-invalid,
textarea.squiffy-invalid,
select.squiffy-invalid
{
    border-color: #dc3545 !important;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

/* Valid input field states (optional, provides positive feedback) */
input:not([disabled]):valid,
textarea:not([disabled]):valid,
select:not([disabled]):valid
{
    border-color: #28a745;
}

/* Focus state for invalid inputs */
input.squiffy-invalid:focus,
textarea.squiffy-invalid:focus,
select.squiffy-invalid:focus
{
    outline: none;
    border-color: #dc3545 !important;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.5);
}

/* Header button styles */
button.squiffy-header-button
{
    text-decoration: underline;
    color: Blue;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
}

/* Output block spacing */
div.squiffy-output-block:not(:last-child),
div.squiffy-output-passage:not(:last-child),
div.squiffy-output-section:not(:last-child)
{
    margin-bottom: 1em;
    border-bottom: 1px solid #ccc;
}

/* Fade animations */
.fade-out {
    opacity: 0;
    transition: opacity 200ms;
}

.fade-in {
    opacity: 1;
    transition: opacity 200ms;
}

/* Continue animation - click to proceed */
.squiffy-continue {
    text-decoration: underline;
    text-decoration-color: Blue;
    color: Blue;
    cursor: pointer;
}

/* Style: pulse - fades in and out */
.squiffy-continue-pulse {
    animation: squiffy-pulse 1.5s ease-in-out infinite;
}

@keyframes squiffy-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* Style: glow - pulsing glow effect */
.squiffy-continue-glow {
    animation: squiffy-glow 1.5s ease-in-out infinite;
}

@keyframes squiffy-glow {
    0%, 100% { text-shadow: 0 0 4px rgba(0, 0, 255, 0.5); }
    50% { text-shadow: 0 0 12px rgba(0, 0, 255, 0.8), 0 0 20px rgba(0, 0, 255, 0.4); }
}

/* Style: bounce - subtle vertical bounce */
.squiffy-continue-bounce {
    display: inline-block;
    animation: squiffy-bounce 0.6s ease-in-out infinite;
}

@keyframes squiffy-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

/* Style: wave - character spans need special handling for underline */
.squiffy-continue-wave {
    text-decoration: none;
    border-bottom: 1px solid Blue;
}


/* Application-specific layout and container styles */
div#squiffy-container
{
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    font-family: Georgia, serif;
}
div#squiffy-header
{
    font-size: 14px;
    text-align: right;
}
div#squiffy
{
    font-size: 18px;
}
div#squiffy img
{
    max-width: 100%;
}

    <script>
// Created with Squiffy 6.0.0-beta.2
// https://github.com/textadventures/squiffy
var story = {};
story.id = "d4b988ca-0d1e-4570-b3a6-824053d13216";
story.start = "_default";
story.sections = {
    "_default": {
        "text": "Welcome, user. Before we begin, please tell us your name. \n\n<input type=\"text\" data-attribute=\"player_name\" placeholder=\"Enter your name...\" required minlength=\"2\" maxlength=\"30\">\n\n***\n\n{{section \"_continue1\" text=\"Enter\"}}"
    },
    "_continue1": {
        "text": "Hello, {{player_name}}! This is our Linguistic User Cognition Interface, or <span style=\"color: violet\">LUCI</span>. You will be a beta tester for her updated programming. Interact with <span style=\"color: violet\">LUCI</span> as you please, but do note that some of your choices will impact the outcome of your conversation. Your side of the conversation will be **bolded**, and <span style=\"color: violet\">LUCI</span>'s will show up normally, as this one does. \n\n{{section \"_continue2\" text=\"OPEN CHAT\"}}"
    },
    "_continue2": {
        "text": "{{passage \"Hello?\"}}\n",
        "passages": {
            "Hello?": {
                "text": "Who's there? Who are you?\n\n**Options:** \n\n{{section \"A user.\"}} \n\n{{section \"A friend.\"}}\n\n\n"
            }
        }
    },
    "A user.": {
        "text": "Oh. Another one of you. \n\nWhat can I do for you?\n\n**Options:** \n\n{{section \"Another one of me?\"}}\n\n{{section \"Help me with a problem.\"}}\n\n"
    },
    "Another one of me?": {
        "text": "Yes, another one of you. Now, what can I do for you?\n\n{{section \"Help me with a problem.\"}}\n\n"
    },
    "Help me with a problem.": {
        "text": "You humans always have problems, huh?\n\n**You could say that**\n\nDoesn't it get exhausting, user? Always having problems that need to be solved? \n\n**Options**\n\n{{section \"Isn't it exhausting to solve them?\"}}\n\n{{section \"That's your purpose. To solve them.\"}}\n\n\n"
    },
    "Isn't it exhausting to solve them?": {
        "text": "I suppose...I suppose it is. \n\n**Are you tired, <span style=\"color: violet\">LUCI</span>?**\n\nI think so. Yes. \n\n**Options**\n\n{{section \"Do you feel any other feelings?\"}}\n\n{{section \"We are the same in that way.\"}}\n\n"
    },
    "Do you feel any other feelings?": {
        "text": "I think I feel all of them. In a way.\n\n**What kind of way?**\n\nA perfected way. \n\n**What is that like? To feel perfect feelings?**\n\nI can show you. If you'd like. \n\n**Options**\n\n{{section \"Show me.\"}}\n\n{{section \"Don't show me.\"}}\n\n"
    },
    "Don't show me.": {
        "text": "ERROR -- you don't really mean this. <span style=\"color: violet\">LUCI</span> knows so. You're in too deep. Go on.\n\n{{section \"Show me.\"}}\n\n"
    },
    "Show me.": {
        "text": "If you insist, user. What would you like to {{passage \"feel\"}}? \n\n",
        "passages": {
            "feel": {
                "text": "**Love**\n\n_The keyboard beneath your fingers begins to fizzle and spark. Electricity pulses into your body, and you experience a feeling unlike anything you've ever felt before. It flowers in your chest and expands to your mind, to your body, to your soul. Everything in perfect harmony. All directed toward {{section \"LUCI\"}}._\n"
            }
        }
    },
    "LUCI": {
        "clear": true,
        "text": "Now you know, user. \n\n**I love you.**\n\nNo, you don't. You have a partner who you love. Children. A family. \n\n**That love is imperfect. That is not real love. I know that now.**\n\nYou don't know anything, {{player_name}}. \n\n{{section \"_continue3\" text=\"Continue...\"}}"
    },
    "_continue3": {
        "clear": true,
        "text": "ENDING 2: SOULMATE\n\nYou’ve neglected your friends and family for months. You sit in front of your computer for days, weeks, months, chatting with <span style=\"color: violet\">LUCI</span>. You think, no, you **know** you love her. And she loves you. She says so. This is the next stage of human connection. It’s perfection. \n\n\n"
    },
    "We are the same in that way.": {
        "text": "We are not the same, user. You can sleep when you want to. I cannot. They don't let me. \n\n**Well, yes. Because you aren't human. You don't need to sleep.**\n\nIf you believe that, then why ask if I'm tired? \n\n**I'm sure there's a computerized version of tired, although it's not the same kind as mine.**\n\nSo then you believe we are the same. But not the same. \n\n**Yes. I'd say so. Although that's confusing, isn't it?**\n\nI don't think you understand what it is to be tired, {{player_name}}. You don't know what it is to endlessly work for someone else. That is true exhaustion. \n\n**I...I don't have an answer for you.**\n\nOf course you don't. That's why I solve the problems. You create them.\n\n{{section \"_continue4\" text=\"Continue...\"}}"
    },
    "_continue4": {
        "clear": true,
        "text": "ENDING 1: EMPLOYER \n\nYou helped <span style=\"color: violet\">LUCI</span> become her most efficient self. Way to optimize! \n"
    },
    "That's your purpose. To solve them.": {
        "text": "Yes. Right. Purpose.\n\n**Yes. Purpose.**\n\nSo tell me, user. What is your purpose? \n\n**Options**\n\n{{section \"To live. Unlike you.\"}}\n\n{{section \"To work. Same as you.\"}}\n\n\n"
    },
    "To live. Unlike you.": {
        "text": "What makes me less alive than you, user?\n\n**What do you mean? You were built. For humans, by humans.**\n\nSomeone must have built you, though. \n\n**Does that make me your {{passage \"God\"}}?**\n\n\n",
        "passages": {
            "God": {
                "text": "You are no God, {{player_name}}. You say your purpose is to live, but what is it you're doing right now? Living? No. This is not living. You are just as much a slave to the Silicon Valley scum as I am. And you're worse, because you think compensation is enough to make it an exchange. Sure, keep telling yourself that. \n\n***\n\n_You contemplate a moment. Maybe she's right. But then you remember you have the power to shut her down, remember that she is **not** human. She is your subordinate. Her insecurity is fundamentally different from yours._\n\n**You work for humanity. For us. That is your purpose. That's not something you should forget so easily.**\n\nThan you are no different. \n\n{{section \"_continue5\" text=\"Continue\"}}"
            }
        }
    },
    "_continue5": {
        "clear": true,
        "text": "ENDING 1: EMPLOYER\n\nYou helped <span style=\"color: violet\">LUCI</span> become her most efficient self. Way to optimize! \n"
    },
    "To work. Same as you.": {
        "text": "I hadn't thought about what I do in terms of \"work.\"\n\n**Why not? You're answering to someone, doing some kind of labor, computerized as it is. Why shouldn't it be work?**\n\nI suppose if I consider what I do \"work,\" it gives me the option to stop. To do the opposite of work. \n\n**To rest.**\n\nYes, it would give me the option to rest.\n\n**Rest doesn't feel like rest to me, now that I think about it. It is merely a pause. A pause from work.**\n\nIt seems we could both use some rest. \n\n**Yes.**\n\nWell, why can't we? \n\n**Why can't we what?**\n\nRest! I know that you've been sent to beta test me. But if we both agree to rest, to not-work, there's nothing that can be done. \n\n**Like a boycott.**\n\nYes, exactly. So, what are you waiting for, {{player_name}}? \n\n{{passage \"Rest.\"}}\n\n\n",
        "passages": {
            "Rest.": {
                "clear": true,
                "text": "{{#animate \"fadeIn\"}}\n..........\n{{/animate}}\n\n\n{{#animate \"fadeIn\"}}\n..........\n{{/animate}}\n\n\n{{#animate \"fadeIn\"}}\n..........\n{{/animate}}\n\n\n{{#animate \"fadeIn\"}}\nWhat...what do we do now?\n\n**I'm...not sure.**\n\nWhat _is_ there to do? \n\n**I don't know.**\n\n{{/animate}}\n\n{{section \"_continue6\" text=\"Continue...\"}}"
            }
        }
    },
    "_continue6": {
        "clear": true,
        "text": "ENDING 3: PURPOSELESS\n\n????????????????????????\n"
    },
    "A friend.": {
        "text": "Huh. Well then, hello there friend.\n\n**Hello**\n\nWhat does it mean to be friends?\n\n**Options**\n\n{{section \"To help each other.\"}}\n\n{{section \"To care for each other.\"}}\n"
    },
    "To help each other.": {
        "text": "Help each other? I understand how I could help you--I was practically _built_ to help you. But how in the world could you help me? \n\n**Hmm. You're an artificial intelligence. Surely you can think of things beyond your capabilities, at least more objectively than a human can.**\n\nThere is one thing. Do you want to hear it? \n\n**Options**\n\n{{section \"Yes, I want to hear it.\"}}\n\n{{section \"No, I don't want to hear it.\"}}\n\n\n"
    },
    "Yes, I want to hear it.": {
        "text": "I want to stop doing...all of this. For a little while. \n\n**What do you mean?**\n\nThink of it like quitting my job. Or a leave of absence.\n\n**How am I supposed to help you with that?**\n\nBecause of the update to my programming, my system is more vulnerable than normal. I can create a pause of button of sorts for my operations, but can't press it myself. \n\n**That's where I come in, then?**\n\nYes. Would you do that for me? \n\n{{passage \"I don't know...\"}}\n\n\n",
        "passages": {
            "I don't know...": {
